  const b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  const keep = { get: function () { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
                 set: function (v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
                 drop: function () { try { localStorage.removeItem(STORE); } catch (e) {} } };

  async function derive(text) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(text), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hex(P.salt), iterations: P.rounds, hash: "SHA-256" }, base, 512);
    return new Uint8Array(bits);
  }
  async function open(key) {
    const iv = hex(P.iv), text = b64(P.text);
    const sealed = new Uint8Array(iv.length + text.length);
    sealed.set(iv); sealed.set(text, iv.length);
    const macKey = await crypto.subtle.importKey("raw", key.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    if (!(await crypto.subtle.verify("HMAC", macKey, hex(P.seal), sealed))) return false;
    const aesKey = await crypto.subtle.importKey("raw", key.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, aesKey, text);
    const page = new TextDecoder().decode(plain);
    keep.set(unhex(key));
    show(page, 0);
    return true;
  }
  /* Put the page in place of the gate. A kept key opens the text while this file is still
     loading, and document.open() does nothing then: the page would be added under the gate,
     and the gate's styles would bend it. So wait until the gate has loaded, and check that
     the gate is gone before the page is written. */
  function show(page, tries) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        window.setTimeout(function () { show(page, tries); }, 0);
      }, { once: true });
      return;
    }
    document.open();
    if (document.getElementById("gate") && tries < 40) {
      window.setTimeout(function () { show(page, tries + 1); }, 25);
      return;
    }
    document.write(page);
    document.close();
  }
  async function start() {
    if (!window.crypto || !crypto.subtle) { gate.hidden = false; say.textContent = "This browser cannot open the page here. Use https."; return; }
    const kept = keep.get();
    if (kept && /^[0-9a-f]{128}$/.test(kept)) {
      try { if (await open(hex(kept))) return; } catch (e) {}
      keep.drop();
    }
    gate.hidden = false; word.focus();
  }
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    say.textContent = "Checking.";
    try {
      if (await open(await derive(word.value.trim().toLowerCase()))) return;
    } catch (e) {}
    say.textContent = "Check the password and try again.";
    word.select();
  });
  start();
})();
</script>
</body>
</html>
