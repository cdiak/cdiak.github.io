   Each rule below names #gate, so that no rule of the gate can reach the page that takes its place. */
:root { --text: 700px; --gap: 96px; --side: 430px; --rail: 196px; --edge: 40px;
  --ink: #111; --paper: #fff; --muted: #666; --hair: #dcdcdc;

  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
[hidden] { display: none !important; }
html { overflow-y: scroll; }   /* the pages behind the gate scroll, so keep the same width as they have */
body { margin: 0; background: var(--paper); color: var(--ink); font: 21px/1.45 var(--serif); -webkit-font-smoothing: antialiased; }
#gate { display: grid; grid-template-columns: minmax(24px, 1fr) minmax(0, var(--text)) minmax(24px, 1fr); }
#gate .masthead { grid-column: 2; padding: 30px 0 24px; box-sizing: border-box; }
#gate .side { grid-column: 2; grid-row: 2; box-sizing: border-box; max-width: var(--side); margin: 0 0 2.6em; align-self: start;
  font: 11px/1.35 var(--mono); letter-spacing: 0.01em; border: 1px solid var(--ink); border-radius: 8px; padding: 14px 16px 12px; }
#gate .text { grid-column: 2; grid-row: 3; min-width: 0; }
#gate h1 { font-weight: 400; font-size: 40px; line-height: 1.04; margin: 0 0 0.3em; letter-spacing: -0.01em; }
#gate p { margin: 0 0 0.9em; }
#gate .byline { margin: 0; font-size: 0.95em; }
#gate h3 { margin: 0 0 6px; font: 10px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
#gate .chip { display: inline-block; background: var(--ink); color: var(--paper); font-weight: 600; font-size: 12px; padding: 3px 9px; border-radius: 4px; }
#gate .block { margin-top: 12px; }
#gate form { display: flex; gap: 6px; }
#gate input { flex: 1; min-width: 0; font: 13px var(--mono); color: var(--ink); background: var(--paper); border: 1px solid var(--ink); border-radius: 5px; padding: 6px 10px; }
#gate button { font: 12px var(--mono); letter-spacing: 0.02em; color: var(--paper); background: var(--ink); border: 1px solid var(--ink); border-radius: 5px; padding: 6px 14px; cursor: pointer; }
#gate input:focus-visible, #gate button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#gate #say { margin: 10px 0 0; font-size: 11.5px; min-height: 1.35em; }
#gate .colophon { margin-top: 5em; padding-top: 14px; border-top: 1px solid var(--hair); font: 11px/1.6 var(--mono); color: var(--muted); }
@media (min-width: 1080px) {
  #gate { grid-template-columns: 32px minmax(0, var(--text)) minmax(40px, 1fr) var(--side) 24px; }
  #gate .masthead { grid-column: 2 / 5; padding: 46px 0 36px; min-height: 220px; }
  #gate h1 { font-size: 46px; }
  #gate .text { grid-row: 2; }
  #gate .side { grid-column: 4; grid-row: 2; max-width: none; margin: 0; }
}
@media (min-width: 1241px) {
  #gate { grid-template-columns: minmax(56px, 1fr) var(--text) minmax(32px, 1fr) var(--side) var(--edge); }
  #gate .masthead { min-height: 235px; }
  #gate h1 { font-size: 52px; }
}
@media (min-width: 1500px) {
  #gate { grid-template-columns: minmax(var(--rail), 1fr) var(--text) var(--gap) var(--side) minmax(var(--edge), 1fr); }
}
@media (max-width: 760px) {
  body { font-size: 18px; line-height: 1.5; }
  #gate { grid-template-columns: 16px minmax(0, 1fr) 16px; }
  #gate h1 { font-size: 31px; }
}
</style>

  const hex = function (s) { return Uint8Array.from(s.match(/../g).map(function (b) { return parseInt(b, 16); })); };
  const unhex = function (a) { return Array.from(a).map(function (b) { return b.toString(16).padStart(2, "0"); }).join(""); };
  const b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  const keep = { get: function () { try { return localStorage.getItem(STORE); } catch (e) { return null; } },
                 set: function (v) { try { localStorage.setItem(STORE, v); } catch (e) {} },
                 drop: function () { try { localStorage.removeItem(STORE); } catch (e) {} } };

  async function derive(text) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(text), "PBKDF2", false, ["deriveBits"]);
    const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hex(P.salt), iterations: P.rounds, hash: "SHA-256" }, base, 512);
    return new Uint8Array(bits);
  }
  async function open(key) {
    const iv = hex(P.iv), text = b64(P.text);
    const sealed = new Uint8Array(iv.length + text.length);
    sealed.set(iv); sealed.set(text, iv.length);
    const macKey = await crypto.subtle.importKey("raw", key.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    if (!(await crypto.subtle.verify("HMAC", macKey, hex(P.seal), sealed))) return false;
    const aesKey = await crypto.subtle.importKey("raw", key.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, aesKey, text);
    const page = new TextDecoder().decode(plain);
    keep.set(unhex(key));
    show(page, 0);
    return true;
  }
  /* Put the page in place of the gate. A kept key opens the text while this file is still
     loading, and document.open() does nothing then: the page would be added under the gate,
     and the gate's styles would bend it. So wait until the gate has loaded, and check that
     the gate is gone before the page is written. */
  function show(page, tries) {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        window.setTimeout(function () { show(page, tries); }, 0);
      }, { once: true });
      return;
    }
    document.open();
    if (document.getElementById("gate") && tries < 40) {
      window.setTimeout(function () { show(page, tries + 1); }, 25);
      return;
    }
    document.write(page);
    document.close();
  }
  async function start() {
    if (!window.crypto || !crypto.subtle) { gate.hidden = false; say.textContent = "This browser cannot open the page here. Use https."; return; }
    const kept = keep.get();
    if (kept && /^[0-9a-f]{128}$/.test(kept)) {
      try { if (await open(hex(kept))) return; } catch (e) {}
      keep.drop();
    }
    gate.hidden = false; word.focus();
  }
  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    say.textContent = "Checking.";
    try {
      if (await open(await derive(word.value.trim().toLowerCase()))) return;
    } catch (e) {}
    say.textContent = "That is not the word.";
    word.select();
  });
  start();
})();
</script>
</body>
</html>
