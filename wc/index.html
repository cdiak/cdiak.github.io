<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Reduce, Flag, Verify</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex, nofollow" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --paper: #fbfaf3;
                --ink: #191813;
                --muted: #8b897d;
                --faint: #cfcdbd;
                --error: #c0392b;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --paper: #131209;
                    --ink: #f0eee3;
                    --muted: #726f61;
                    --faint: #403e2e;
                    --error: #f87171;
                }
            }
            .staticrypt-html { height: 100%; }
            .staticrypt-body {
                height: 100%; margin: 0; background: var(--paper); color: var(--ink);
                font-family: Charter, Georgia, "Times New Roman", serif;
                -webkit-font-smoothing: antialiased;
            }
            .staticrypt-content { height: 100%; display: flex; align-items: center; justify-content: center; }
            .staticrypt-page { width: 100%; max-width: 400px; padding: 0 24px 6vh; text-align: center; }
            .staticrypt-title {
                font-size: 27px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 18px;
            }
            .staticrypt-instructions p.staticrypt-sub {
                font-family: "SF Mono", ui-monospace, Menlo, monospace;
                font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase;
                color: var(--muted); margin: 0 0 26px;
            }
            .staticrypt-form-row { display: flex; gap: 10px; }
            .staticrypt-password-container { position: relative; flex: 1; }
            input#staticrypt-password {
                width: 100%; box-sizing: border-box; padding: 11px 38px 11px 14px;
                border-radius: 5px; border: 1px solid var(--faint); background: transparent;
                color: var(--ink); font-family: "SF Mono", ui-monospace, Menlo, monospace;
                font-size: 0.9rem; outline: none; transition: border-color 0.2s;
            }
            input#staticrypt-password:focus { border-color: var(--ink); }
            .staticrypt-toggle-password-visibility {
                cursor: pointer; height: 16px; width: 16px; opacity: 45%;
                position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            }
            @media (prefers-color-scheme: dark) {
                .staticrypt-toggle-password-visibility { filter: invert(0.9); }
            }
            .staticrypt-decrypt-button {
                padding: 11px 20px; border-radius: 5px; border: 1px solid var(--ink);
                background: transparent; color: var(--ink);
                font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 0.82rem;
                letter-spacing: 0.06em; cursor: pointer; transition: background 0.15s, color 0.15s;
            }
            .staticrypt-decrypt-button:hover { background: var(--ink); color: var(--paper); }
            label.staticrypt-remember {
                display: flex; align-items: center; justify-content: center; gap: 8px;
                margin-top: 18px; font-family: "SF Mono", ui-monospace, Menlo, monospace;
                font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
                color: var(--muted); cursor: pointer;
            }
            .staticrypt-remember input[type="checkbox"] { accent-color: var(--ink); margin: 0; }
            .staticrypt-error {
                font-family: "SF Mono", ui-monospace, Menlo, monospace;
                font-size: 0.72rem; color: var(--error); margin-top: 14px; min-height: 1.2em;
            }
            .hidden { display: none !important; }
            .staticrypt-spinner-container {
                height: 100%; display: flex; align-items: center; justify-content: center;
                background: var(--paper);
            }
            .staticrypt-spinner {
                display: inline-block; width: 1.6rem; height: 1.6rem;
                border: 0.2em solid var(--faint); border-right-color: transparent;
                border-radius: 50%; animation: spinner-border 0.75s linear infinite;
            }
            @keyframes spinner-border { 100% { transform: rotate(360deg); } }
        </style>
    </head>
